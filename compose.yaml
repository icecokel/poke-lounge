name: poke-lounge

x-app: &app
  image: poke-lounge:local
  build:
    context: .
    args:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
  init: true

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3001
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-docker-local-google-client-id}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: ${DB_USERNAME:-poke_lounge}
  DB_PASSWORD: ${DB_PASSWORD:-poke_lounge}
  DB_DATABASE: ${DB_DATABASE:-poke_lounge}
  DB_SYNCHRONIZE: "false"
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-poke_lounge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-poke_lounge}
      POSTGRES_DB: ${DB_DATABASE:-poke_lounge}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis-data:/data

  migrate:
    <<: *app
    command: ["pnpm", "--filter", "@poke-lounge/api", "migration:run"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    command: ["pnpm", "--filter", "@poke-lounge/api", "start:prod"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-3001}:3001"

  turn-worker:
    <<: *app
    restart: unless-stopped
    command: ["pnpm", "--filter", "@poke-lounge/api", "start:turn-worker"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    command:
      [
        "pnpm",
        "--filter",
        "@poke-lounge/web",
        "exec",
        "next",
        "start",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-docker-local-google-client-id}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-docker-local-google-client-secret}
      AUTH_SECRET: ${AUTH_SECRET:-docker-local-auth-secret-change-before-production}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ko-KR/game').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  redis-data:
