name: poke-lounge

x-logging: &bounded-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "10"

x-node-app: &node-app
  image: poke-lounge-node:local
  init: true
  logging: *bounded-logging

x-db-environment: &db-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: ${DB_USERNAME:-poke_lounge}
  DB_PASSWORD: ${DB_PASSWORD:-poke_lounge}
  DB_DATABASE: ${DB_DATABASE:-poke_lounge}
  DB_SYNCHRONIZE: "false"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_USER: ${DB_USERNAME:-poke_lounge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-poke_lounge}
      POSTGRES_DB: ${DB_DATABASE:-poke_lounge}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *bounded-logging
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis-data:/data

  migrate:
    <<: *node-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_POKE_BACKEND: rust
        NEXT_PUBLIC_RELEASE_SHA: ${RELEASE_SHA:-}
    command:
      [
        "sh",
        "-lc",
        "pnpm --filter @poke-lounge/api migration:run && pnpm --filter @poke-lounge/api rom-data:import",
      ]
    environment: *db-environment
    depends_on:
      postgres:
        condition: service_healthy

  battle-worker:
    <<: *node-app
    restart: unless-stopped
    command: ["pnpm", "--filter", "@poke-lounge/battle-worker", "start"]
    environment:
      NODE_ENV: production
      BATTLE_WEB_ROOT: /app/apps/web
      BATTLE_WORKER_HOST: 0.0.0.0
      BATTLE_WORKER_PORT: 3021
      BATTLE_WORKER_TOKEN: ${BATTLE_WORKER_TOKEN:?Set BATTLE_WORKER_TOKEN}
      RELEASE_SHA: ${RELEASE_SHA:-local}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3021/health',{headers:{'x-worker-token':process.env.BATTLE_WORKER_TOKEN},signal:AbortSignal.timeout(2000)}).then(async response=>{const body=await response.json();process.exit(response.ok&&body.readyWorkers>0?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 15s

  api:
    image: poke-lounge-api-rust:local
    build:
      context: .
      dockerfile: apps/api-rust/Dockerfile
    init: true
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      RUST_API_BIND_ADDR: 0.0.0.0:3011
      RUST_API_ALLOW_REMOTE: "true"
      RUST_API_REDIS_URL: redis://redis:6379/0
      BATTLE_WORKER_URL: http://battle-worker:3021
      BATTLE_WORKER_TOKEN: ${BATTLE_WORKER_TOKEN:?Set BATTLE_WORKER_TOKEN}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-poke_lounge}
      DB_PASSWORD: ${DB_PASSWORD:-poke_lounge}
      DB_DATABASE: ${DB_DATABASE:-poke_lounge}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      RUST_LOG: info
      RUST_API_LOG_DIR: /var/log/poke-lounge
      RELEASE_SHA: ${RELEASE_SHA:-local}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      battle-worker:
        condition: service_healthy
    volumes:
      - runtime-logs:/var/log/poke-lounge
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--max-time",
          "4",
          "http://127.0.0.1:3011/health/ready",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 45s
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-3001}:3011"

  web:
    <<: *node-app
    restart: unless-stopped
    command:
      [
        "pnpm",
        "--filter",
        "@poke-lounge/web",
        "exec",
        "next",
        "start",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_POKE_BACKEND: rust
      NEXT_PUBLIC_RELEASE_SHA: ${RELEASE_SHA:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ko-KR').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  redis-data:
  runtime-logs:
    external: true
    name: poke-lounge-runtime-logs
