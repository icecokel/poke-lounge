name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: "1"
      LOCAL_TEST_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared battle package
        run: pnpm build:poke-lounge-battle

      - name: Formatting
        run: pnpm format:check

      - name: Required static checks
        run: |
          pnpm exec prettier --check ".github/workflows/**/*.{yml,yaml}"
          pnpm lint
          pnpm check:rust-room-contract
          pnpm check:rust-ts-constants
          pnpm check:engine-version-lock
          pnpm check:league-static
          pnpm check:poke-lounge-i18n
          pnpm check:poke-lounge-move-effects
          pnpm check:poke-lounge-competitive-catalog
          pnpm check:poke-lounge-rom-catalog
          pnpm check:poke-lounge-battle-resolution
          pnpm poke-lounge:audio:verify

      # Rust fmt/check/clippy/build run once, in the rust job below.

      # Only build/static checks run in CI. Player testing requires observed browser input.
      - name: Production build without account authentication
        run: pnpm build

      # next build generates the route types referenced by next-env.d.ts on a clean checkout.
      - name: Web type check
        run: pnpm type:check:web

  # Required status check "rust". Keep the job id; the ruleset matches it by name.
  rust:
    runs-on: ubuntu-latest
    container: rust:1.98.1-bookworm
    timeout-minutes: 15
    concurrency:
      group: ci-rust-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Registry downloads and compiled dependencies. The key only changes with Cargo.lock or the
      # toolchain, so pull requests reuse the cache saved on main; a miss just builds from scratch.
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
            target
          key: rust-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.1-

      # Player tests require observed UI input. This job only compiles and lints.
      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --release --locked

  deploy:
    needs: [verify, rust]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-api.yml
    secrets:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      BATTLE_WORKER_TOKEN: ${{ secrets.BATTLE_WORKER_TOKEN }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      LEAGUE_JUDGE_TOKEN: ${{ secrets.LEAGUE_JUDGE_TOKEN }}
      LEAGUE_AGENT_LOGIN_TOKEN: ${{ secrets.LEAGUE_AGENT_LOGIN_TOKEN }}
