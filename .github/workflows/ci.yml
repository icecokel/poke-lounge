name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting (advisory)
        continue-on-error: true
        run: pnpm format:check

      - name: Required static checks
        run: |
          pnpm exec prettier --check ".github/workflows/**/*.{yml,yaml}"
          pnpm lint
          pnpm type:check:web
          pnpm check:api-contract
          python3 scripts/poke-lounge/test_extract_rom_game_data.py
          pnpm --filter @poke-lounge/api rom-data:check
          pnpm check:poke-lounge-i18n
          pnpm check:poke-lounge-competitive-catalog
          pnpm check:poke-lounge-battle-resolution
          pnpm poke-lounge:audio:verify

      - name: Unit tests and build
        run: |
          pnpm test
          pnpm build
