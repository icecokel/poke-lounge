name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    outputs:
      deploy_required: ${{ steps.deploy-changes.outputs.required }}
    # Same-repository pushes and PRs may use the self-hosted OCI runner named by the
    # POKE_LOUNGE_CI_RUNNER variable (a JSON label list). Fork PRs always stay on
    # GitHub-hosted runners so untrusted code never runs on the production host.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.POKE_LOUNGE_CI_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 40
    concurrency:
      group: ci-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: "1"
      LOCAL_TEST_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Detect deployment changes
        id: deploy-changes
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          required=true
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "Deployment required: manual workflow dispatch"
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Deployment required: no previous push SHA"
          elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "Deployment required: previous push commit is unavailable"
          else
            git diff --name-only --no-renames -z "$BEFORE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/deploy-changed-paths"
            required=false
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md|docs/*|.github/ISSUE_TEMPLATE/*) ;;
                *) required=true; break ;;
              esac
            done < "$RUNNER_TEMP/deploy-changed-paths"
            if [[ "$required" == true ]]; then
              echo "Deployment required: runtime or deployment files changed"
            else
              echo "Deployment skipped: only documentation or issue templates changed (or no changed paths)"
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared battle package
        run: pnpm build:poke-lounge-battle

      - name: Formatting
        run: pnpm format:check

      - name: Required static checks
        run: |
          pnpm exec prettier --check ".github/workflows/**/*.{yml,yaml}"
          pnpm lint
          pnpm check:rust-room-contract
          pnpm check:rust-ts-constants
          pnpm check:engine-version-lock
          pnpm check:league-static
          pnpm check:poke-lounge-i18n
          pnpm check:poke-lounge-move-effects
          pnpm check:poke-lounge-competitive-catalog
          pnpm check:poke-lounge-rom-catalog
          pnpm check:poke-lounge-battle-resolution
          pnpm poke-lounge:audio:verify

      # Rust fmt/check/clippy/build run once, in the rust job below.

      # Only build/static checks run in CI. Player testing requires observed browser input.
      - name: Production build without account authentication
        run: pnpm build

      # next build generates the route types referenced by next-env.d.ts on a clean checkout.
      - name: Web type check
        run: pnpm type:check:web

  # Required status check "rust". Keep the job id; the ruleset matches it by name.
  rust:
    # Same-repository pushes and PRs may use the self-hosted OCI runner named by the
    # POKE_LOUNGE_CI_RUNNER variable (a JSON label list). Fork PRs always stay on
    # GitHub-hosted runners so untrusted code never runs on the production host.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.POKE_LOUNGE_CI_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    container: rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    timeout-minutes: 45
    concurrency:
      group: ci-rust-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Registry downloads and compiled dependencies. The key only changes with Cargo.lock or the
      # toolchain, so pull requests reuse the cache saved on main; a miss just builds from scratch.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-1.98.1-

      # Player tests require observed UI input. This job only compiles and lints.
      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --release --locked

      # The container runs as root. Hand the workspace back to the runner user so the next
      # checkout on a self-hosted runner can clean it.
      - name: Restore workspace ownership
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"

  deploy:
    needs: [verify, rust]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.verify.outputs.deploy_required == 'true'
    uses: ./.github/workflows/deploy-api.yml
    secrets: inherit
