name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: "1"
      LOCAL_TEST_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared battle package
        run: pnpm build:poke-lounge-battle

      - name: Formatting (advisory)
        continue-on-error: true
        run: pnpm format:check

      - name: Required static checks
        run: |
          pnpm exec prettier --check ".github/workflows/**/*.{yml,yaml}"
          pnpm lint
          pnpm check:api-contract
          python3 scripts/poke-lounge/test_extract_rom_game_data.py
          pnpm --filter @poke-lounge/api rom-data:check
          pnpm check:poke-lounge-i18n
          pnpm check:poke-lounge-competitive-catalog
          pnpm check:poke-lounge-battle-resolution
          pnpm poke-lounge:audio:verify

      - name: Unit tests
        run: pnpm test

      - name: Production build without account authentication
        run: pnpm build

      # next build generates the route types referenced by next-env.d.ts on a clean checkout.
      - name: Web type check
        run: pnpm type:check:web

      - name: Storybook build used by Docker
        run: pnpm --filter @poke-lounge/web build:storybook

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-api.yml
    secrets:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
