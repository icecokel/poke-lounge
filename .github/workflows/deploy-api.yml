name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - scripts/**
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-api.yml

concurrency:
  group: deploy-poke-lounge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, poke-lounge]
    env:
      BIND_ADDRESS: ${{ vars.BIND_ADDRESS || '127.0.0.1' }}
      WEB_PORT: ${{ vars.WEB_PORT || '3100' }}
      API_PORT: ${{ vars.API_PORT || '3101' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      COMPOSE_BAKE: "false" # ponytail: Remove after docker-buildx is installed on the runner.
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment configuration
        run: |
          test -n "$NEXT_PUBLIC_API_URL"
          test -n "$CORS_ORIGINS"
          test -n "$DB_PASSWORD"
          command -v docker
          docker compose version

      - name: Deploy Docker Compose stack
        run: docker compose up --build --detach --remove-orphans --wait --wait-timeout 180

      - name: Verify health
        run: |
          curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/health" >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${WEB_PORT}/ko-KR/game" >/dev/null
