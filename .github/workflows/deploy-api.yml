name: Deploy

on:
  workflow_call:
    secrets:
      DB_PASSWORD:
        required: true
      BATTLE_WORKER_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-poke-lounge
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20
    runs-on: [self-hosted, linux, x64, poke-lounge]
    env:
      BIND_ADDRESS: ${{ vars.BIND_ADDRESS || '127.0.0.1' }}
      WEB_PORT: ${{ vars.WEB_PORT || '3100' }}
      API_PORT: ${{ vars.API_PORT || '3101' }}
      RELEASE_SHA: ${{ github.sha }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      BATTLE_WORKER_TOKEN: ${{ secrets.BATTLE_WORKER_TOKEN }}
      COMPOSE_BAKE: "false" # ponytail: Remove after docker-buildx is installed on the runner.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify deployment configuration
        run: |
          test -n "$NEXT_PUBLIC_API_URL"
          test -n "$CORS_ORIGINS"
          test -n "$DB_PASSWORD"
          test -n "$BATTLE_WORKER_TOKEN"
          command -v docker
          docker compose version
          docker volume create poke-lounge-runtime-logs >/dev/null
          docker run --rm -v poke-lounge-runtime-logs:/logs alpine:3.20 \
            sh -c 'chown 10001:10001 /logs && chmod 0700 /logs'

      - name: Archive logs from the current containers
        run: bash scripts/deploy/archive-poke-lounge-logs.sh

      - name: Deploy Docker Compose stack
        run: docker compose up --build --detach --remove-orphans --wait --wait-timeout 180

      - name: Verify health
        run: |
          curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/health" >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/health/ready" >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/poke-lounge/rooms/public" >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${WEB_PORT}/ko-KR" >/dev/null
          docker compose exec -T api sh -c \
            'test -s "$RUST_API_LOG_DIR/api.jsonl" && test "$(stat -c %a "$RUST_API_LOG_DIR/api.jsonl")" = 600 && grep -Fq "$RELEASE_SHA" "$RUST_API_LOG_DIR/api.jsonl"'
