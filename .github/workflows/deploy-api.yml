name: Deploy

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-poke-lounge
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 60
    # POKE_LOUNGE_DEPLOY_RUNNER (JSON label list) selects the production host's runner.
    # Without it, the previous Mac mini runner labels apply.
    runs-on: ${{ fromJSON(vars.POKE_LOUNGE_DEPLOY_RUNNER || '["self-hosted","macOS","ARM64","poke-lounge"]') }}
    env:
      COMPOSE_PROJECT_NAME: poke-lounge-prod
      BIND_ADDRESS: ${{ vars.BIND_ADDRESS || '127.0.0.1' }}
      WEB_PORT: ${{ vars.WEB_PORT || '3100' }}
      API_PORT: ${{ vars.API_PORT || '3101' }}
      RELEASE_SHA: ${{ github.sha }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      RUST_API_TRUSTED_PROXIES: ${{ vars.RUST_API_TRUSTED_PROXIES }}
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
      DISCORD_REDIRECT_URI: ${{ vars.DISCORD_REDIRECT_URI }}
      AUTH_WEB_ORIGIN: ${{ vars.AUTH_WEB_ORIGIN }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      BATTLE_WORKER_TOKEN: ${{ secrets.BATTLE_WORKER_TOKEN }}
      COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES }}
      LEAGUE_ENABLED: ${{ vars.LEAGUE_ENABLED }}
      LEAGUE_JUDGE_URL: ${{ vars.LEAGUE_JUDGE_URL || 'http://league-judge:3031' }}
      LEAGUE_JUDGE_TOKEN: ${{ secrets.LEAGUE_JUDGE_TOKEN }}
      LEAGUE_SEASON1_STARTS_AT: ${{ vars.LEAGUE_SEASON1_STARTS_AT }}
      LEAGUE_SEASON1_STARTERS: ${{ vars.LEAGUE_SEASON1_STARTERS }}
      LEAGUE_SEASON1_STARTER_LEVEL: ${{ vars.LEAGUE_SEASON1_STARTER_LEVEL }}
      LEAGUE_SETTLE_GRACE_HOURS: ${{ vars.LEAGUE_SETTLE_GRACE_HOURS }}
      LEAGUE_EXP_MULTIPLIER: ${{ vars.LEAGUE_EXP_MULTIPLIER }}
      LEAGUE_STARTER_POOL: ${{ vars.LEAGUE_STARTER_POOL }}
      LEAGUE_AGENT_LOGIN_TOKEN: ${{ secrets.LEAGUE_AGENT_LOGIN_TOKEN }}
      LEAGUE_AGENT_ACCOUNTS: ${{ vars.LEAGUE_AGENT_ACCOUNTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Verify deployment configuration
        run: |
          test -n "$NEXT_PUBLIC_API_URL"
          test -n "$CORS_ORIGINS"
          test -n "$DB_PASSWORD"
          test -n "$BATTLE_WORKER_TOKEN"
          discord_values=0
          for name in DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_REDIRECT_URI; do
            value="${!name}"
            if [ -n "${value//[[:space:]]/}" ]; then
              discord_values=$((discord_values + 1))
            fi
          done
          if [ "$discord_values" -ne 0 ] && [ "$discord_values" -ne 3 ]; then
            echo "DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET and DISCORD_REDIRECT_URI must be set together" >&2
            exit 1
          fi
          command -v docker
          docker compose version
          docker volume create poke-lounge-runtime-logs >/dev/null
          docker run --rm -v poke-lounge-runtime-logs:/logs alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc \
            sh -c 'chown 10001:10001 /logs && chmod 0700 /logs'

      - name: Deploy and verify Docker Compose stack
        run: bash scripts/deploy/deploy-stack.sh

      # Linux hosts own their Docker engine; drop dangling images and old build cache so the
      # boot volume does not fill up. Volumes and tagged images are never touched.
      - name: Prune old build cache
        if: runner.os == 'Linux'
        run: |
          docker image prune --force >/dev/null
          docker buildx prune --force --max-used-space 15GB >/dev/null
          df -h /
