name: PR branch flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR branch direction
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" == feature/?* ]]; then
            echo "Allowed: feature/* -> main"
          else
            echo "::error::Allowed PR route: feature/* -> main."
            exit 1
          fi
