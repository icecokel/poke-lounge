name: PR branch flow

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR branch direction
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "dev" && "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "Allowed: dev -> main"
          elif [[ "$BASE_REF" == "dev" && "$HEAD_REF" == feature/?* ]]; then
            echo "Allowed: feature/* -> dev"
          elif [[ "$BASE_REF" == "dev" && "$HEAD_REF" == "main" && "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "Allowed: main -> dev"
          else
            echo "::error::Allowed PR routes: feature/* -> dev, dev -> main, main -> dev."
            exit 1
          fi
